[package]
name = "koalisi"
version = "0.11.0"
edition = "2024"
rust-version = "1.88.0"
description = "Reference implementation of agentic coalitions in Rust — tokio::sync task seams, temporal hypergraph topology, coalition algorithms, and optional Active Inference decision-making"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
serde = { version = "1.0", features = ["derive"] }

# Topology backend: catgraph's CRUD hypergraph container (the K1 re-back,
# catgraph#23 design). SSH URL (not HTTPS) because catgraph is private and git
# here is SSH-only — same rationale as `aif` / `catgraph-magnitude`. Tag kept
# in lockstep with `catgraph-magnitude` (one repo, one checkout — a tag split
# duplicates catgraph/catgraph-applied/itertools compile units; the
# v0.1.1 → v0.2.0 delta touches only catgraph-magnitude, applied is
# source-identical).
catgraph-applied = { git = "ssh://git@github.com/sustia-llc/catgraph", tag = "v0.2.0" }
rayon = "1.12"
tokio-rayon = "2.1"

# Optional: Active Inference decision strategy (expected free energy).
# Engine crate from the `tira` repo. When the `decision` feature is off, none
# of this (and none of its nalgebra dependency) is compiled — the non-AIF
# ThresholdPolicy / ValueCalculator path is always available without it.
aif = { git = "ssh://git@github.com/sustia-llc/tira", tag = "aif-v0.5.0", optional = true }

# Optional: categorical magnitude decision strategy (coalition diversity via
# catgraph's enriched-category magnitude). SSH URL (not HTTPS) because catgraph
# is private and git here is SSH-only — same rationale as the `aif` dep above.
catgraph-magnitude = { git = "ssh://git@github.com/sustia-llc/catgraph", tag = "v0.2.0", optional = true }

# Optional: durable coalition decision messaging (two-tier SurrealDB bus:
# CHANGEFEED log + LIVE wake-up + cursor catch-up; at-least-once,
# restart-durable). Enabled via `--features durable`. Feature-off builds pull
# NONE of this (and none of surrealdb/nalgebra). SSH URL — same rationale as the
# other sustia-llc git deps. Upstream's package name is `surrealdb_live_message`
# (underscores); the readable hyphen key is remapped via `package = ...`.
surrealdb-live-message = { git = "ssh://git@github.com/sustia-llc/surrealdb-live-message", tag = "v0.2.0", package = "surrealdb_live_message", optional = true }
# `#[derive(SurrealValue)]` on koalisi's durable `DecisionEvent` emits absolute
# `::surrealdb_types` paths, so the trait crate must be a direct dep. Version
# unifies with the one `surrealdb-live-message` pulls (resolved 3.2.0) so the derived impl
# satisfies its `Coalition<T>: SurrealValue` bound. Pure-value types crate, no DB
# engine; only compiled under `durable`.
surrealdb-types = { version = "3.1.5", optional = true }

# Optional: Phase 7 persistence core (feature `persistence`). CBOR frames via
# ciborium + SHA-256 chaining via sha2. Feature-off builds pull neither.
ciborium = { version = "0.2", optional = true }
sha2 = { version = "0.10", optional = true }

[features]
default = []
# Active Inference coalition-decision strategy (pluggable, off by default).
decision = ["dep:aif"]
# Categorical-magnitude coalition-decision strategy (pluggable, off by default).
magnitude = ["dep:catgraph-magnitude"]
# Durable coalition decision-event bus on surrealdb-live-message (off by default).
durable = ["dep:surrealdb-live-message", "dep:surrealdb-types"]
# Phase 7 persistence core: portable hash-chained event log (off by default).
persistence = ["dep:ciborium", "dep:sha2"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
futures = "0.3"

[[example]]
name = "strategy_comparison"
required-features = ["decision", "magnitude"]

[[example]]
name = "durable_decisions"
required-features = ["durable"]

[[test]]
name = "magnitude_trajectory"
required-features = ["magnitude"]

[[test]]
name = "durable_integration"
required-features = ["durable"]

[[test]]
name = "persistence_integration"
required-features = ["persistence"]

[[test]]
name = "topology_replay"
required-features = ["persistence"]

[[test]]
name = "replay_parity"
required-features = ["persistence", "magnitude"]
