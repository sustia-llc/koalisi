[package]
name = "koalisi"
version = "0.29.0"
edition = "2024"
# 1.93 floor forced by catgraph's deep_causality_num 0.4.1 pin (unchanged at
# the v0.8.0 re-pin — catgraph holds num =0.4.1 there; catgraph v0.9.0 removes
# that crate, so the floor is re-testable at the NEXT re-pin, not this one).
rust-version = "1.93.0"
description = "Reference implementation of agentic coalitions in Rust — tokio::sync task seams, temporal hypergraph topology, coalition algorithms, and optional Active Inference decision-making"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sustia-llc/koalisi"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
serde = { version = "1.0", features = ["derive"] }

# Topology backend: catgraph's CRUD hypergraph container (the K1 re-back,
# catgraph#23 design). HTTPS URL since catgraph went public (was SSH while
# private). Tag kept in lockstep with `catgraph-magnitude` (one repo, one
# checkout — a tag split duplicates catgraph/catgraph-applied/itertools
# compile units).
catgraph-applied = { git = "https://github.com/sustia-llc/catgraph", tag = "v0.8.0" }
rayon = "1.12"
tokio-rayon = "2.1"

# Optional: Active Inference decision strategy (expected free energy).
# Engine crate from the `tira` repo. When the `decision` feature is off, none
# of this (and none of its nalgebra dependency) is compiled — the non-AIF
# ThresholdPolicy / ValueCalculator path is always available without it.
# HTTPS since tira went public (2026-07-27; was SSH while private).
aif = { git = "https://github.com/sustia-llc/tira", tag = "aif-v0.13.0", optional = true }
# The multi-modality AIF bridge (`aif-mm`, prereg K4-v3) constructs a
# `GenerativeModel` directly, which is expressed over `nalgebra::DMatrix`. Version
# unifies with the one `aif` already pulls transitively (0.35), so no new build.
# Only compiled under `decision`.
nalgebra = { version = "0.35", optional = true }

# Optional: categorical magnitude decision strategy (coalition diversity via
# catgraph's enriched-category magnitude). HTTPS since catgraph went public;
# tag in lockstep with `catgraph-applied` above.
catgraph-magnitude = { git = "https://github.com/sustia-llc/catgraph", tag = "v0.8.0", optional = true }

# Optional: the colored-syntax layer over catgraph-applied's free-prop term
# engine — the `FrobeniusOr` spider family and the textual presentation surface.
# Consumed by the EQ5a process-structured task surface (`src/process/`, feature
# `process`, issue #76). Tag in LOCKSTEP with the two catgraph deps above (one
# repo, one checkout — a tag split duplicates the catgraph/catgraph-applied
# compile units). Feature-off builds pull NEITHER this nor its transitive
# `deep_causality_haft`.
catgraph-syntax = { git = "https://github.com/sustia-llc/catgraph", tag = "v0.8.0", optional = true }

# Optional: durable coalition decision messaging (two-tier SurrealDB bus:
# CHANGEFEED log + LIVE wake-up + cursor catch-up; at-least-once,
# restart-durable). Enabled via `--features durable`. Feature-off builds pull
# NONE of this (and none of surrealdb/nalgebra). HTTPS — the repo is public.
# Upstream's package name is `surrealdb_live_message`
# (underscores); the readable hyphen key is remapped via `package = ...`.
surrealdb-live-message = { git = "https://github.com/sustia-llc/surrealdb-live-message", tag = "v0.2.1", package = "surrealdb_live_message", optional = true }
# `#[derive(SurrealValue)]` on koalisi's durable `DecisionEvent` emits absolute
# `::surrealdb_types` paths, so the trait crate must be a direct dep. Version
# unifies with the one `surrealdb-live-message` pulls (3.2.1 since its v0.2.1) so the
# derived impl satisfies its `Coalition<T>: SurrealValue` bound. Pure-value types crate,
# no DB engine; only compiled under `durable`.
surrealdb-types = { version = "3.2.1", optional = true }

# Optional: Phase 7 persistence core (feature `persistence`). CBOR frames via
# ciborium + SHA-256 chaining via sha2. Feature-off builds pull neither.
ciborium = { version = "0.2", optional = true }
sha2 = { version = "0.10", optional = true }

# Optional: transport for the domain-neutral remote coalition-event gateway
# (feature `remote`, issue #38). Raw libp2p `request-response` over TCP + noise
# + yamux, with mDNS discovery and CBOR codecs. This is the
# publish-to-outside-world boundary only — never the hot path. Feature-off
# builds pull NONE of it.
libp2p = { version = "0.56", features = [
    "macros",
    "noise",
    "mdns",
    "tcp",
    "tokio",
    "yamux",
    "request-response",
    "cbor",
], optional = true }

[features]
default = []
# Active Inference coalition-decision strategy (pluggable, off by default).
decision = ["dep:aif", "dep:nalgebra"]
# Categorical-magnitude coalition-decision strategy (pluggable, off by default).
magnitude = ["dep:catgraph-magnitude"]
# EQ3 levers L2 + L3 (#69, prereg Amendment 1): compile the upstream `f64-fast`
# factorization and expose `MagnitudePolicy::with_eq3_levers`, the opt-in toggle
# carrying BOTH levers. L3 routes FRESH full-coalition magnitudes through the
# `f64` factorization handle; L2 is the exact zero-diversity proof branch, which
# is **deliberately decision-changing** — it declines certified exact-zero joins
# that the frozen arm takes on positive float roundoff (~0.8% of certified
# candidates measured). Implies `magnitude`. The toggle defaults OFF, so merely
# enabling this feature changes no decision (the registered X-B identity gate);
# turning it ON selects the `mag-eq3` arm, not a faster `mag`.
magnitude-fast = ["magnitude", "catgraph-magnitude/f64-fast"]
# Durable coalition decision-event bus on surrealdb-live-message (off by default).
durable = ["dep:surrealdb-live-message", "dep:surrealdb-types"]
# Phase 7 persistence core: portable hash-chained event log (off by default).
persistence = ["dep:ciborium", "dep:sha2"]
# Domain-neutral remote coalition-event gateway over raw libp2p
# `request-response` (off by default, issue #38).
remote = ["dep:libp2p"]
# EQ5a (#76, prereg `docs/prereg-K4-eq5a-process-structured.md` D6/D8):
# process-structured coalition tasks. Workflows as colored string diagrams over
# `FrobeniusOr<Step>`, demand extraction, the pinned rewrite theory (Amendment
# 1), the staffing price, and the bounded convex-DPO `optimize` hook. Implies
# `magnitude` — the arm the registration's control staffs a workflow with — and
# gates the `catgraph-syntax` dependency.
process = ["magnitude", "dep:catgraph-syntax"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
futures = "0.3"

[[example]]
name = "strategy_comparison"
# `process` joins the list at EQ5a (#76 Stage 2): Part 9 staffs colored string
# diagrams through `koalisi::process`. CONSEQUENCE: the example — and the frozen
# Parts 1–8 battery with it — now builds only with all THREE features on.
required-features = ["decision", "magnitude", "process"]

[[example]]
name = "durable_decisions"
required-features = ["durable"]

[[example]]
name = "population_reliability"
required-features = ["decision"]

[[example]]
name = "remote_coalition_consumer"
required-features = ["remote"]

[[test]]
name = "magnitude_trajectory"
required-features = ["magnitude"]

[[test]]
name = "durable_integration"
required-features = ["durable"]

[[test]]
name = "persistence_integration"
required-features = ["persistence"]

[[test]]
name = "topology_replay"
required-features = ["persistence"]

[[test]]
name = "replay_parity"
required-features = ["persistence", "magnitude"]

[[test]]
name = "remote_integration"
required-features = ["remote"]
