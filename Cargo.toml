[package]
name = "koalisi"
version = "0.6.0"
edition = "2024"
rust-version = "1.88.0"
description = "Reference implementation of agentic coalitions in Rust — kameo actors, temporal hypergraph topology, coalition algorithms, and optional Active Inference decision-making"
license = "MIT OR Apache-2.0"

[dependencies]
# Kameo actor framework — local path while the upstream 0.20.0 is the working baseline.
kameo = { path = "../../agentics/kameo" }
kameo_actors = { path = "../../agentics/kameo/actors" }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
serde = { version = "1.0", features = ["derive"] }

# Hypergraph — directed hypergraph data structure (topology layer)
hypergraph = { git = "https://github.com/yamafaktory/hypergraph", tag = "v4.2.0" }
rayon = "1.12"
tokio-rayon = "2.1"

# Optional: Active Inference decision strategy (expected free energy).
# Engine crate from the `tira` repo. When the `decision` feature is off, none
# of this (and none of its nalgebra dependency) is compiled — the non-AIF
# ThresholdPolicy / ValueCalculator path is always available without it.
aif = { git = "ssh://git@github.com/sustia-llc/tira", tag = "aif-v0.5.0", optional = true }

# Optional: categorical magnitude decision strategy (coalition diversity via
# catgraph's enriched-category magnitude). SSH URL (not HTTPS) because catgraph
# is private and git here is SSH-only — same rationale as the `aif` dep above.
catgraph-magnitude = { git = "ssh://git@github.com/sustia-llc/catgraph", tag = "v0.1.0", optional = true }

# Optional: databento DBN-file adapter. Enabled via `--features databento`.
dbn = { version = "0.58", features = ["async"], optional = true }
time = { version = "0.3", optional = true, features = ["macros"] }

# Optional: libp2p-based remote actor RPC. Enabled via `--features remote`.
# We add libp2p directly because the swarm builder + `#[derive(NetworkBehaviour)]`
# need to be visible in OUR code (not just transitively through kameo).
libp2p = { version = "0.56", features = ["macros", "noise", "mdns", "tcp", "tokio", "yamux"], optional = true }

[features]
default = []
# Active Inference coalition-decision strategy (pluggable, off by default).
decision = ["dep:aif"]
# Categorical-magnitude coalition-decision strategy (pluggable, off by default).
magnitude = ["dep:catgraph-magnitude"]
databento = ["dep:dbn", "dep:time"]
remote = ["kameo/remote", "dep:libp2p"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
futures = "0.3"

[[example]]
name = "strategy_comparison"
required-features = ["decision", "magnitude"]

[[example]]
name = "databento_historical"
required-features = ["databento"]

[[example]]
name = "databento_live_replay"
required-features = ["databento"]

[[example]]
name = "distributed_alert_consumer"
required-features = ["remote"]

[[test]]
name = "databento_integration"
required-features = ["databento"]

[[test]]
name = "remote_integration"
required-features = ["remote"]
