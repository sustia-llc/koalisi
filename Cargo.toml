[package]
name = "koalisi"
version = "0.35.0"
edition = "2024"
# Declared floor 1.93.0 — owner decision C-D1 (2026-09-14): KEEP; do not lower
# in passing. Edition 2024 means resolver 3, so this value also bounds
# dependency resolution (`cargo update` selects versions compatible with it).
# The measured floor is feature-conditional and lies below the declaration
# (measured 2026-09-16 on the current lock):
#   1.88  default, `magnitude`, `persistence`, `remote`, `process`, `harness`
#         (1.87 fails on let-chains in the `catgraph 0.23.0` lib)
#   1.89  + `decision`, `magnitude-fast`, `decision,magnitude,process`
#         (nalgebra 0.35 / safe_arch 1.0 / wide 1.5 declare 1.89)
#   1.92  + `durable` (1.91 fails to compile `diskann`)
# To re-measure: set `rust-version` to 1.85.0 temporarily, run
# `cargo +<v> check --all-targets --locked --features <set>` per feature set,
# restore 1.93.0, diff the manifest. Never `--ignore-rust-version`: it also
# suppresses the dependency checks. Full record: CLAUDE.md gotcha 34.
rust-version = "1.93.0"
description = "Reference implementation of agentic coalitions in Rust — tokio::sync task seams, temporal hypergraph topology, coalition algorithms, and optional Active Inference decision-making"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sustia-llc/koalisi"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
serde = { version = "1.0", features = ["derive"] }

# Topology backend: catgraph's CRUD hypergraph container. Tag kept in lockstep
# with `catgraph-magnitude` and `catgraph-syntax` — all three move together
# (one repo, one checkout; a tag split duplicates the catgraph compile units).
catgraph-applied = { git = "https://github.com/sustia-llc/catgraph", tag = "v0.23.0" }
rayon = "1.12"
tokio-rayon = "2.1"

# Optional: Active Inference decision strategy (expected free energy), the
# engine crate from the `tira` repo. Feature `decision` off compiles none of it
# nor nalgebra; `ThresholdPolicy` / `ValueCalculator` need neither.
aif = { git = "https://github.com/sustia-llc/tira", tag = "aif-v0.13.0", optional = true }
# The multimodal AIF bridge builds a `GenerativeModel` over `nalgebra::DMatrix`;
# the version unifies with the one `aif` pulls. Only compiled under `decision`.
nalgebra = { version = "0.35", optional = true }

# Optional: categorical magnitude decision strategy (coalition diversity via
# catgraph's enriched-category magnitude). Tag in lockstep with
# `catgraph-applied` above.
catgraph-magnitude = { git = "https://github.com/sustia-llc/catgraph", tag = "v0.23.0", optional = true }

# Optional: the colored-syntax layer over catgraph-applied's free-prop term
# engine — the `FrobeniusOr` spider family and the presentation surface —
# consumed by `src/process/` (feature `process`). Tag in lockstep with the two
# catgraph deps above. Its dependency set is catgraph + catgraph-applied +
# thiserror; no DeepCausality crate enters the graph through it.
catgraph-syntax = { git = "https://github.com/sustia-llc/catgraph", tag = "v0.23.0", optional = true }

# Optional: durable coalition decision messaging (two-tier SurrealDB bus:
# CHANGEFEED log + LIVE wake-up + cursor catch-up; at-least-once,
# restart-durable), feature `durable`. Upstream's package name is
# `surrealdb_live_message`; the hyphenated key is remapped via `package`.
surrealdb-live-message = { git = "https://github.com/sustia-llc/surrealdb-live-message", tag = "v0.2.1", package = "surrealdb_live_message", optional = true }
# `#[derive(SurrealValue)]` on the durable `DecisionEvent` emits absolute
# `::surrealdb_types` paths, so the trait crate is a direct dep; the version
# unifies with the one `surrealdb-live-message` pulls. Pure-value types crate,
# no DB engine; only compiled under `durable`.
surrealdb-types = { version = "3.2.4", optional = true }

# Optional: Phase 7 persistence core (feature `persistence`). CBOR frames via
# ciborium + SHA-256 chaining via sha2. Feature-off builds pull neither.
ciborium = { version = "0.2", optional = true }
sha2 = { version = "0.11", optional = true }

# Optional: transport for the remote coalition-event gateway (feature
# `remote`): libp2p `request-response` over TCP + noise + yamux, mDNS
# discovery, CBOR codecs. The publish-to-outside-world boundary, never the hot
# path.
libp2p = { version = "0.57", features = [
    "macros",
    "noise",
    "mdns",
    "tcp",
    "tokio",
    "yamux",
    "request-response",
    "cbor",
], optional = true }

[features]
default = []
# Active Inference coalition-decision strategy (pluggable, off by default).
decision = ["dep:aif", "dep:nalgebra"]
# Categorical-magnitude coalition-decision strategy (pluggable, off by default).
magnitude = ["dep:catgraph-magnitude"]
# EQ3 levers L2 + L3: compiles the upstream `f64-fast` factorization and
# exposes `MagnitudePolicy::with_eq3_levers`, an opt-in toggle carrying both.
# L3 routes fresh full-coalition magnitudes through the `f64` handle; L2 is the
# exact zero-diversity proof branch, which is decision-changing (it declines
# certified exact-zero joins the frozen arm takes on float roundoff). Implies
# `magnitude`. The toggle defaults off, so enabling the feature alone changes
# no decision; turning it on selects the `mag-eq3` arm, not a faster `mag`.
magnitude-fast = ["magnitude", "catgraph-magnitude/f64-fast"]
# Durable coalition decision-event bus on surrealdb-live-message (off by default).
durable = ["dep:surrealdb-live-message", "dep:surrealdb-types"]
# Phase 7 persistence core: portable hash-chained event log (off by default).
persistence = ["dep:ciborium", "dep:sha2"]
# Domain-neutral remote coalition-event gateway over libp2p `request-response`
# (off by default).
remote = ["dep:libp2p"]
# Process-structured coalition tasks: workflows as colored string diagrams over
# `FrobeniusOr<Step>`, demand extraction, the pinned rewrite theory, the
# staffing price, and the bounded convex-DPO `optimize` hook. Implies
# `magnitude` and gates the `catgraph-syntax` dependency.
process = ["magnitude", "dep:catgraph-syntax"]
# K7 harness: seeded instance generation, the battery loop, report helpers
# (`src/harness/`, off by default, no dependencies). Registrations are examples
# gated on it.
harness = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
futures = "0.3"

[[example]]
name = "strategy_comparison"
# The frozen K4 archive binary (Parts 1–11); Part 9 staffs colored string
# diagrams through `koalisi::process`, so all three features are required.
required-features = ["decision", "magnitude", "process"]

[[example]]
name = "durable_decisions"
required-features = ["durable"]

[[example]]
name = "population_reliability"
required-features = ["decision"]

[[example]]
name = "remote_coalition_consumer"
required-features = ["remote"]

[[example]]
name = "gauntlet"
required-features = ["harness"]

[[test]]
name = "magnitude_trajectory"
required-features = ["magnitude"]

[[test]]
name = "durable_integration"
required-features = ["durable"]

[[test]]
name = "persistence_integration"
required-features = ["persistence"]

[[test]]
name = "topology_replay"
required-features = ["persistence"]

[[test]]
name = "replay_parity"
required-features = ["persistence", "magnitude"]

[[test]]
name = "remote_integration"
required-features = ["remote"]

[[test]]
name = "harness_workflow"
required-features = ["harness", "process"]
